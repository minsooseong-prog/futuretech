<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>졸라맨 놀이터 — 살아 있는 졸라맨과 놀기</title>
<meta name="description" content="마우스 커서로 130가지가 넘는 상호작용을 할 수 있고, 아무것도 하지 않아도 혼자 화면을 걸어 다니며 살아가는 졸라맨." />
<meta name="theme-color" content="#f7f7f8" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cg fill='none' stroke='%23F26A21' stroke-width='7' stroke-linecap='round'%3E%3Ccircle cx='32' cy='15' r='10'/%3E%3Cpath d='M32 25v18M32 30l-12 8M32 30l12 8M32 43l-9 15M32 43l9 15'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <!-- 배경(사용자가 올린 이미지가 여기에 깔린다) -->
  <div id="bg"></div>
  <div id="bgdim"></div>

  <!-- 졸라맨이 사는 캔버스 -->
  <canvas id="stage"></canvas>

  <!-- UI 레이어 -->
  <div id="ui"></div>

  <div class="hint" id="hint">
    <span>클릭 · 드래그 · 우클릭 · 박스 선택으로 <b><span id="found">0</span>/<span id="total">0</span></b> 가지 상호작용을 찾아보세요</span>
    <button id="hintX" aria-label="닫기">×</button>
  </div>

  <noscript><p style="padding:2rem">이 페이지는 자바스크립트가 필요합니다.</p></noscript>

  <script type="module" src="./js/main.js"></script>
  <script>
    document.getElementById('hintX').addEventListener('click', () => {
      document.getElementById('hint').classList.add('gone');
    });
    setTimeout(() => document.getElementById('hint')?.classList.add('gone'), 14000);
  </script>
</body>
</html>
